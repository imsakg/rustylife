name: CLI quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Install quality components
        run: rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Lints (graphics is opt-in)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Library and process integration tests
        run: cargo test --locked --all-targets
      - name: API documentation tests
        run: cargo test --locked --doc
      - name: Release workflow smoke
        run: python examples/demo.py

[package]
name = "rustylife"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "rustylife"
description = "Local-first habits, goals and progress reviews"

[features]
default = []
simulation = ["dep:rand", "dep:raylib4-sys"]

[[bin]]
name = "rustylife"
path = "src/bin/rustylife.rs"

[[bin]]
name = "smoothlife"
path = "src/main.rs"
required-features = ["simulation"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tempfile = "3"
rand = { version = "0.8.5", optional = true }
raylib4-sys = { version = "0.1.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
